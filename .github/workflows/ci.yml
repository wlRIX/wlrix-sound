name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The PipeWire bindings build against the system's headers, as in xdg-desktop-portal-wlrix.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      # The tests are the theme lookup, decoding, the config and the socket. Playback and the bus
      # need a session and a sound server and are verified by hand, as the README describes.
      - name: Test
        run: cargo test --verbose
