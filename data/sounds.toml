# wlrix-sound settings. Copy to ~/.config/wlrix/sounds.toml and edit, or use the settings panel.
#
# Every key is optional; the values below are the defaults. An unknown key makes the whole file
# be ignored (and says so in the session log), so check a hand edit with
#
#     wlrix-sound --check-config ~/.config/wlrix/sounds.toml
#
# `kill -HUP $(cat $XDG_RUNTIME_DIR/wlrix-sound.pid)` applies a change without a restart.

# Play system sounds at all. Off silences everything, including the login and logout sounds.
enabled = true

# The sound theme, by directory name under share/sounds on the XDG data path. `wlrix` is the
# IRIX Indigo Magic soundscheme; `freedesktop` is the stock theme most distributions ship.
theme = "wlrix"

# The sink to play through, by PipeWire node name (`wpctl status`, or `node.name` in `pw-dump`).
# Empty follows the default output. A sink that is not there falls back to the default.
output = ""

# Sounds that never play, by sound name -- `wlrix-launch`, `desktop-switch-left`, and so on.
# `wlrix-sound` on the bus lists every name the desktop plays (`Events`). For one sound at a
# time; the [play] switches below turn off whole kinds.
disabled = []

# The System & Desktop Sounds panel's checkboxes. Each sound belongs to one of these, and plays
# only while it is on. The defaults are a default IRIX 6.5 desktop's.
[play]
# Logging in, logging out and locking. The sounds are an Indy's power-on and power-off tunes,
# which IRIX played at the machine's startup and shutdown, never at a login.
startup = false
# Icons, folders, launching, drag-and-drop, the dumpster, disks: the IRIX soundscheme.
desktop = true
# Windows opening, closing, minimizing and restoring, and changing desks. IRIX played none.
windows = false
# Dialogs and other things that want attention.
alerts = true
# The bell, for a refused action or a terminal's ^G.
bell = true
